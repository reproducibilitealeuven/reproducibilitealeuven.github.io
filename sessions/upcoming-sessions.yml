  description: |
    Start the new academic year with a special ReproducibiliTea session featuring the Research Survival Game, developed by KU Leuven Libraries. In this interactive board game, players take on the role of researchers navigating the research landscape, learning about topics such as Open Access, Research Data Management, and good research practices along the way. Through questions, discussion, and a bit of friendly competition, participants will explore key concepts relevant to responsible and open research. Whether you're new to ReproducibiliTea or a familiar face, join us for a fun and engaging start to the year.

    Resource:
    https://bib.kuleuven.be/english/research/researchsurvivalgame

