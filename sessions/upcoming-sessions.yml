- path: https://tinyurl.com/reprotealvn
  image: "/files/images/reproducibilitealeuven_logo.png"
  title: "Is There Only One Correct Analysis?" 
  author: "Peer-Ole Jacobsen"
  categories: []
  date: 2026-12-08T16:00:00
  location: VHI 03.64
  location-link: https://www.kuleuven.be/kulag/en/lokaal/108-01-030064/onderwijs
  description: |
    Multiverse analyses have emerged as a prominent approach for addressing researcher degrees of freedom and evaluating the robustness of empirical findings. In this ReproducibiliTea journal club, we will discuss two pre-prints that offer complementary perspectives on the role of multiverse analyses in scientific research. The discussion will focus on the benefits and limitations of multiverse analyses, whether robustness across multiple specifications provides stronger evidence, and how researchers can balance transparency with theoretical and methodological justification.
    
    References:
    Lakens, D., Rasti, S., & Tunç, M. N. (2026). There is only one correct analysis. PsyArXiv. https://osf.io/preprints/psyarxiv/hvjxf_v1/
    Nepomuceno, A., Ghosal, A., Sandoval-Lentisco, A., & Ioannidis, J. P. A. (2026). Uptake and Implementation of Multiverse-style Analyses Across 613 Studies. bioRxiv. 

