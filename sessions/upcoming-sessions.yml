- path: https://tinyurl.com/reprotealvn
  image: "/files/images/reproducibilitealeuven_logo.png"
  title: "Open Science in the Humanities" 
  author: "Guest Speaker: Brecht Liefsoens"
  categories: []
  date: 2026-11-24T16:15:00
  location: MSI 01.20
  location-link: https://www.kuleuven.be/kulag/en/lokaal/118-01-010020/onderwijs
  description: |
    Open science ideals, largely derived from the "hard sciences", have seen significant success, but research in the arts and humanities often struggles to meet goals of transparency and reproducibility. This discrepancy arises from different scholarly customs and challenges inherent to diverse fields. Some propose the concept of Open Humanities to tailor Open Science ideals to the arts and humanities, while others advocate for a broader Open Research framework that encompasses all disciplines. The aim is to develop a shared understanding of Open Research's implications across various fields, addressing the unique challenges presented by each. 
    
    Recommended reading: 
    Paul Longley Arthur & Lydia Hearn, Toward Open Research: A Narrative Review of the Challenges and Opportunities for Open Humanities in Journal of Communication 71 (nr. 5, 2021), pp. 827-853. https://doi.org/10.1093/joc/jqab028

    
- path: https://tinyurl.com/reprotealvn
  image: "/files/images/reproducibilitealeuven_logo.png"
  title: "Is There Only One Correct Analysis?" 
  author: "Peer-Ole Jacobsen"
  categories: []
  date: 2026-12-08T16:00:00
  location: VHI 03.64
  location-link: https://www.kuleuven.be/kulag/en/lokaal/108-01-030064/onderwijs
  description: |
    Multiverse analyses have emerged as a prominent approach for addressing researcher degrees of freedom and evaluating the robustness of empirical findings. In this ReproducibiliTea journal club, we will discuss two pre-prints that offer complementary perspectives on the role of multiverse analyses in scientific research. The discussion will focus on the benefits and limitations of multiverse analyses, whether robustness across multiple specifications provides stronger evidence, and how researchers can balance transparency with theoretical and methodological justification.
    
    References:
    Lakens, D., Rasti, S., & Tunç, M. N. (2026). There is only one correct analysis. PsyArXiv. https://osf.io/preprints/psyarxiv/hvjxf_v1/
    Nepomuceno, A., Ghosal, A., Sandoval-Lentisco, A., & Ioannidis, J. P. A. (2026). Uptake and Implementation of Multiverse-style Analyses Across 613 Studies. bioRxiv. 

